openapi: 3.0.0
info:
  title: Auralis Remote API
  version: 1.0.0
  description: API for Auralis Remote Control and Data Access
paths:
  /status:
    get:
      summary: Get system status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /scan:
    post:
      summary: Trigger a media scan
      responses:
        '202':
          description: Scan accepted
  /organize:
    post:
      summary: Trigger media organization
      responses:
        '202':
          description: Organize accepted
  /library:
    get:
      summary: Get library contents with pagination
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
  /track/{id}:
    get:
      summary: Get track by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
components:
  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
        uptime:
          type: integer
    Track:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        album:
          type: string
