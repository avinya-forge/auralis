openapi: 3.0.3
info:
  title: Auralis API
  version: 0.8.1
  description: OpenAPI 3.0 definitions for Auralis music management.
servers:
  - url: http://localhost:8000/api/v1
    description: Local Dev Server

paths:
  /status:
    get:
      summary: Get system status
      description: Returns uptime, version, total tracks, and active workers.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptime:
                    type: string
                    example: "12:34:56"
                  version:
                    type: string
                    example: "0.8.1"
                  total_tracks:
                    type: integer
                    example: 12500
                  active_workers:
                    type: integer
                    example: 4

  /library:
    get:
      summary: Get library tracks
      description: Returns an array of serialized track objects.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'

  /scan:
    post:
      summary: Start a new scan job
      description: Triggers MusicScanner for a given directory path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dir_path
              properties:
                dir_path:
                  type: string
                  example: "/mnt/music/new_arrivals"
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJob'

components:
  schemas:
    Track:
      type: object
      properties:
        id:
          type: string
          example: "trk_12345"
        title:
          type: string
          example: "Bohemian Rhapsody"
        artist:
          type: string
          example: "Queen"
        album:
          type: string
          example: "A Night at the Opera"
        genre:
          type: string
          example: "Rock"
        added_date:
          type: string
          format: date-time
          example: "2023-10-24T12:00:00Z"
        file_path:
          type: string
          example: "/mnt/music/Queen/A Night at the Opera/01-Bohemian Rhapsody.flac"

    ScanJob:
      type: object
      properties:
        job_id:
          type: string
          example: "job_98765"
        status:
          type: string
          example: "pending"
        target_dir:
          type: string
          example: "/mnt/music/new_arrivals"
        queued_at:
          type: string
          format: date-time
          example: "2023-10-24T12:05:00Z"
