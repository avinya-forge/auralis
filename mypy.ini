[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
strict = False

[mypy-src.core.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-src.services.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-src.utils.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-src.gui.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-src.cli.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-tests.*]
ignore_errors = True

[mypy-wx.*]
ignore_missing_imports = True

[mypy-mutagen.*]
ignore_missing_imports = True

[mypy-pyacoustid.*]
ignore_missing_imports = True

[mypy-discogs_client.*]
ignore_missing_imports = True

[mypy-musicbrainzngs.*]
ignore_missing_imports = True

[mypy-spotipy.*]
ignore_missing_imports = True

[mypy-pylast.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-librosa.*]
ignore_missing_imports = True

[mypy-soundfile.*]
ignore_missing_imports = True

[mypy-speech_recognition.*]
ignore_missing_imports = True

[mypy-langdetect.*]
ignore_missing_imports = True

[mypy-pydub.*]
ignore_missing_imports = True

[mypy-bs4.*]
ignore_missing_imports = True
